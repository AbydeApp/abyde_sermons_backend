name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: abyde_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d abyde_ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/abyde_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration / e2e tests (in-memory adapters, external providers mocked)
        run: npm run test:e2e
      - name: Migrations apply cleanly to an ephemeral database
        run: npx prisma migrate deploy
      - name: Schema drift and destructive-migration checks
        run: node scripts/check-migrations.mjs
      - name: Build
        run: npm run build
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Docker image builds
        run: docker build --target runtime -t abyde-sermon-api:ci .
