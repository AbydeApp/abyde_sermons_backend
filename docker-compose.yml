services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: abyde
      POSTGRES_PASSWORD: abyde_dev_password
      POSTGRES_DB: abyde_sermon
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U abyde -d abyde_sermon']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development (bucket created by `npm run storage:init`).
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: abyde
      RUSTFS_SECRET_KEY: abyde_dev_password
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - storage-data:/data

volumes:
  storage-data:
  postgres-data:
  redis-data:
